<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Received — Yuxoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --fg: #ffffff;
            --fg-secondary: rgba(255,255,255,0.6);
            --glass-border: rgba(255,255,255,0.25);
            --glass-backdrop: blur(80px) saturate(250%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 150% 120% at 50% -20%, rgba(255,255,255,0.2) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .success-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 500px;
        }

        .success-card {
            padding: 3rem 2rem;
            background: rgba(10,10,10,0.8);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            backdrop-filter: var(--glass-backdrop);
            box-shadow: 0 40px 80px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.15);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: rgba(100,255,100,0.2);
            border: 2px solid rgba(100,255,100,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 900;
        }

        .success-subtitle {
            font-size: 15px;
            color: var(--fg-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .success-details {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--fg-secondary);
        }

        .detail-value {
            font-weight: 600;
        }

        .success-btn {
            display: inline-block;
            padding: 0.875rem 2rem;
            background: var(--fg);
            color: var(--bg);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .success-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 70px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-card">
            <div class="success-icon" id="success-icon" aria-hidden="true">…</div>
            <h1 id="success-title" aria-live="polite">Request Received</h1>
            <p class="success-subtitle" id="success-message" role="status">We are preparing your payment link.</p>
            
            <div class="success-details">
                <div class="detail-row">
                    <span class="detail-label">Request ID</span>
                    <span class="detail-value" id="order-id">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Plan</span>
                    <span class="detail-value" id="plan-name">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Amount</span>
                    <span class="detail-value" id="amount">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Email status</span>
                    <span class="detail-value" id="payment-status">Checking</span>
                </div>
            </div>
            
            <a href="./" class="success-btn">Back to Home</a>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script>
        const API = (window.YUXORO_API_URL || window.location.origin).replace(/\/$/, '');
        const reference = new URLSearchParams(window.location.search).get('reference');
        const title = document.getElementById('success-title');
        const message = document.getElementById('success-message');
        const icon = document.getElementById('success-icon');
        const status = document.getElementById('payment-status');
        const amount = document.getElementById('amount');

        function showProblem(text) {
            title.textContent = 'Request details unavailable';
            message.textContent = text;
            status.textContent = 'Please contact us';
            status.style.color = '#ff8a8a';
            icon.textContent = '!';
            icon.style.background = 'rgba(255,100,100,0.15)';
            icon.style.borderColor = 'rgba(255,100,100,0.45)';
        }

        async function showRequest() {
            if (!reference) {
                showProblem('We could not find your request reference. Please contact us at 01000006619.');
                return;
            }

            try {
                const response = await fetch(`${API}/api/payment-request-status?reference=${encodeURIComponent(reference)}`, { cache: 'no-store' });
                const request = await response.json();
                if (!response.ok || !request.success) {
                    throw new Error(request.error || 'We could not find this request.');
                }

                document.getElementById('order-id').textContent = request.reference;
                document.getElementById('plan-name').textContent = [request.plan, ...(request.addons || [])].join(' · ');
                amount.textContent = `${new Intl.NumberFormat('en-EG').format(request.amount)} ${request.currency}/month`;
                title.textContent = 'Request Received';
                if (request.customerEmailStatus === 'sent') {
                    message.textContent = 'Hello. We are Yuxoro Marketing. Please wait while we send you the payment link. If you have any questions, please contact 01000006619.';
                    status.textContent = 'Confirmation email sent';
                    status.style.color = '#64ff64';
                    icon.textContent = '✓';
                    icon.style.background = 'rgba(100,255,100,0.2)';
                    icon.style.borderColor = 'rgba(100,255,100,0.5)';
                } else {
                    message.textContent = 'We received your request, but could not send the confirmation email. Please contact us at 01000006619.';
                    status.textContent = 'Email not sent';
                    status.style.color = '#ffcc80';
                    icon.textContent = '!';
                    icon.style.background = 'rgba(255,180,80,0.15)';
                    icon.style.borderColor = 'rgba(255,180,80,0.45)';
                }
            } catch (error) {
                showProblem(error.message || 'Please contact us at 01000006619.');
            }
        }

        showRequest();
    </script>
</body>
</html>
