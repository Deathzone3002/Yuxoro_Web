<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuxoro Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="admin-logo">Yuxoro Admin</div>
            <nav class="admin-nav">
                <button class="nav-btn active" data-tab="overview" onclick="switchTab('overview')">Dashboard</button>
                <button class="nav-btn" data-tab="orders" onclick="switchTab('orders')">Orders</button>
                <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">Settings</button>
            </nav>
            <button class="nav-btn logout" onclick="logout()">Sign Out</button>
        </aside>

        <main class="admin-main">
            <!-- OVERVIEW TAB -->
            <div id="overview" class="admin-tab active">
                <h1>Dashboard</h1>
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Total Orders</div>
                        <div class="metric-value" id="total-orders">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Paid Orders</div>
                        <div class="metric-value" id="paid-orders">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Total Revenue</div>
                        <div class="metric-value" id="total-revenue">$0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Conversion</div>
                        <div class="metric-value" id="conversion-rate">0%</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>

            <!-- ORDERS TAB -->
            <div id="orders" class="admin-tab">
                <h1>Orders</h1>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search by email..." onkeyup="filterOrders()">
                </div>
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Name</th>
                            <th>Plan</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- SETTINGS TAB -->
            <div id="settings" class="admin-tab">
                <h1>Settings</h1>
                <div class="settings-group">
                    <label>
                        <input type="checkbox" id="maintenance-toggle" onchange="toggleMaintenance()">
                        <span>Maintenance Mode</span>
                    </label>
                    <p class="settings-desc">When enabled, users cannot access the site.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="api-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
